<script id="capvora-home-hat-carousel-v10-js">
(function(){
 function initYOUMUSEHatCarousel(){
  const root=document.querySelector('[data-capvora-carousel]');
  if(!root)return;
  const viewport=root.querySelector('[data-carousel-viewport]');
  const track=root.querySelector('[data-carousel-track]');
  const prev=root.querySelector('[data-carousel-prev]');
  const next=root.querySelector('[data-carousel-next]');
  const pageLabel=root.querySelector('[data-carousel-page]');
  const cards=[...root.querySelectorAll('[data-carousel-card]')];
  let pageCount=1,perPage=5;
  function visibleCount(){return window.matchMedia('(max-width:560px)').matches?2:(window.matchMedia('(max-width:900px)').matches?3:5)}
  function update(){
    const pageWidth=viewport.clientWidth||1;
    const current=Math.min(pageCount-1,Math.round(viewport.scrollLeft/pageWidth));
    pageLabel.textContent=(current+1)+' / '+pageCount;
    prev.disabled=viewport.scrollLeft<=2;
    next.disabled=viewport.scrollLeft+viewport.clientWidth>=viewport.scrollWidth-2;
  }
  function recalc(reset){
    perPage=visibleCount();
    const gap=parseFloat(getComputedStyle(track).columnGap||getComputedStyle(track).gap||0)||0;
    const available=Math.max(120,viewport.clientWidth);
    const cardWidth=Math.floor((available-gap*(perPage-1))/perPage);
    cards.forEach(card=>card.style.setProperty('--cap-card-width',cardWidth+'px'));
    pageCount=Math.ceil(cards.length/perPage);
    if(reset)viewport.scrollTo({left:0,behavior:'auto'});
    update();
  }
  function move(dir){
    viewport.scrollBy({left:dir*viewport.clientWidth,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }
  prev.addEventListener('click',()=>move(-1));
  next.addEventListener('click',()=>move(1));
  viewport.addEventListener('scroll',()=>window.requestAnimationFrame(update),{passive:true});
  let resizeTimer;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>recalc(true),100);
  },{passive:true});
  viewport.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}
    if(e.key==='ArrowRight'){e.preventDefault();move(1)}
  });
  if('ResizeObserver' in window){
    const observer=new ResizeObserver(()=>recalc(false));
    observer.observe(viewport);
  }
  recalc(true);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initYOUMUSEHatCarousel);
 else initYOUMUSEHatCarousel();
})();
</script>
